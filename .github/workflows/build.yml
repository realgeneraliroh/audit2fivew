name: Test, Build, and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Run unit tests
        run: go test -v ./...

  build:
    name: Build Linux Binaries & RPMs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Install RPM packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Build static binaries and archives
        run: |
          set -euo pipefail

          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -E '^Version:' audit2fivew.spec | awk '{print $2}')"
          fi
          LDFLAGS="-s -w -X main.Version=${VERSION}"

          mkdir -p dist

          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
          )

          for platform in "${PLATFORMS[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            TARGET="audit2fivew-${VERSION}-${GOOS}-${GOARCH}"

            echo "==> Building ${TARGET}..."
            STAGE_DIR="/tmp/stage-${TARGET}"
            rm -rf "${STAGE_DIR}"
            mkdir -p "${STAGE_DIR}"

            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags "${LDFLAGS}" \
              -o "${STAGE_DIR}/audit2fivew" .

            # Standalone binary
            cp "${STAGE_DIR}/audit2fivew" "dist/audit2fivew-${GOOS}-${GOARCH}"

            # Tarball bundle
            cp README.md LICENSE audit2fivew.1 "${STAGE_DIR}/"
            tar -czf "dist/${TARGET}.tar.gz" -C "${STAGE_DIR}" audit2fivew README.md LICENSE audit2fivew.1
            rm -rf "${STAGE_DIR}"
          done

      - name: Build RPM packages using nfpm
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            RPM_VERSION="${GITHUB_REF_NAME#v}"
          else
            RPM_VERSION="$(grep -E '^Version:' audit2fivew.spec | awk '{print $2}')"
          fi

          echo "Installing nfpm packager..."
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

          for arch in amd64 arm64; do
            echo "==> Building RPM for ${arch}..."
            sed -e "s/\${ARCH}/${arch}/g" -e "s/\${VERSION}/${RPM_VERSION}/g" nfpm.yaml > "/tmp/nfpm-${arch}.yaml"
            nfpm pkg --config "/tmp/nfpm-${arch}.yaml" --packager rpm --target dist/
            rm -f "/tmp/nfpm-${arch}.yaml"
          done

          echo "RPM packages built in dist/:"
          ls -lh dist/*.rpm

      - name: Build Source RPM (SRPM) and Vendor Archive for EPEL
        run: |
          set -euo pipefail

          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -E '^Version:' audit2fivew.spec | awk '{print $2}')"
          fi

          go mod vendor
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          # Source0: Untouched upstream code archive (matches GitHub tag archive)
          tar czf "rpmbuild/SOURCES/audit2fivew-${VERSION}.tar.gz" \
            --transform "s,^,audit2fivew-${VERSION}/," \
            --exclude=rpmbuild --exclude=.git --exclude=vendor \
            main.go doc.go go.mod go.sum \
            internal/ \
            Makefile audit2fivew.spec README.md LICENSE audit2fivew.1

          # Source1: Offline vendor archive
          tar czf "rpmbuild/SOURCES/audit2fivew-${VERSION}-vendor.tar.gz" vendor/

          # Copy vendor tarball to dist/ so it is published to GitHub Releases
          cp -v "rpmbuild/SOURCES/audit2fivew-${VERSION}-vendor.tar.gz" dist/

          rpmbuild -bs \
            --define "_topdir $(pwd)/rpmbuild" \
            --define "version ${VERSION}" \
            audit2fivew.spec || true

          find rpmbuild/SRPMS -type f -name '*.rpm' -exec cp -v {} dist/ \;
          rm -rf vendor rpmbuild

      - name: Generate Checksums
        run: |
          (cd dist && sha256sum * > sha256sums.txt)
          echo "Build complete. Artifacts in dist/:"
          ls -lh dist/

      - name: Upload artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: audit2fivew-release-assets
          path: dist/

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: audit2fivew-release-assets
          path: dist/

      - name: Publish GitHub Release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          echo "Publishing release for tag ${TAG}..."

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, updating assets..."
            gh release upload "${TAG}" dist/* --clobber
          else
            echo "Creating new release for tag ${TAG}..."
            gh release create "${TAG}" dist/* \
              --title "Release ${TAG}" \
              --notes "Official release ${TAG} of audit2fivew with Linux static binaries, archives, and RPMs."
          fi
          echo "GitHub Release published successfully!"

